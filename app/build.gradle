plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

import java.util.Properties
import java.io.FileInputStream

android {
    namespace 'com.example.screentimeoverlay'
    compileSdk 34

    defaultConfig {
        applicationId "com.screentime.overlay"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        
        // Add proper app name and description
        resValue "string", "app_name", "Screen Time Tracker"
        resValue "string", "app_description", "Track your screen time with beautiful overlays and detailed analytics"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("app/keystore.properties")
            def keystoreProperties = new Properties()
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    
    // Android 12+ Material You support
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    
    // Edge lighting and AOD support
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    
    // Lock screen widgets
    implementation 'androidx.glance:glance-appwidget:1.0.0'
    implementation 'androidx.glance:glance-material3:1.0.0'
    
    // Samsung Edge Lighting - removed as it's not available in public repositories
    // Note: Samsung-specific features should be implemented using reflection or conditional compilation
}


